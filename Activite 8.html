    class App extends React.Component {
      constructor(props) {
        super(props);
        this.state = {
          msg: "Veuillez vous inscrire",
          ins: "Inscription",
          cloche: cloche1              
        };
        this.inscrire = this.inscrire.bind(this);
        this.sonner = this.sonner.bind(this);
        this.arreter = this.arreter.bind(this);
        this.jouerSon = this.jouerSon.bind(this);
        this.son = new Audio(sonCloche);
      }

      styles = {
        fontWeight: "bold",
        color: "teal"
      };

      stylesCloche = {
        width: "150px",
        height: "150px",
        display: "block",
        marginTop: "20px",
        cursor: "pointer"
      };

      inscrire() {
        this.jouerSon();
        this.setState({
          msg: "Suivez les màj",
          ins: "Déjà inscrit"
        });
      }

      sonner() {
        this.setState({ cloche: cloche2 });
      }

      arreter() {
        this.setState({ cloche: cloche1 });
      }

      jouerSon() {
        this.son.currentTime = 0;
        this.son.play();
      }

      render() {
        return (
          <div>
            <h1 style={this.styles}>{this.state.msg}</h1>
            <button onClick={this.inscrire}>{this.state.ins}</button>
            <img
              src={this.state.cloche}
              alt="cloche"
              style={this.stylesCloche}
              onMouseOver={this.sonner}
              onMouseOut={this.arreter}
              onClick={this.jouerSon}
            />
          </div>
        );
      }
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
